name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar projeto
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/phantom/launcher
          mv index.html app/src/main/assets/
          mv MainActivity.kt app/src/main/java/com/phantom/launcher/
          mv AndroidManifest.xml app/src/main/
          mv app-build.gradle.kts app/build.gradle.kts
          [ -f configurações.gradle.kts ] && mv configurações.gradle.kts settings.gradle.kts || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhantomLauncher-apk
          path: app/build/outputs/apk/debug/*.apk
